<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#367BC7">
<title>Bahasa Inggris TL Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1794120565">
<link rel="stylesheet" href="retro.css?v=1794120565">
</head>
<body>
<!-- SVG lens filter: refraction for the glass (Chromium) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lens" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- ===== Layer 1: content (full-bleed) ===== -->
<main id="content">
  <section class="hero tone-dark" id="beranda" data-tab="beranda"></section>
  <div id="sems"></div>
  <section class="plain tone-light" id="pustaka" data-tab="pustaka"></section>
  <section class="plain tone-light" id="profil" data-tab="profil"></section>
</main>

<!-- ===== Layer 2: floating controls ===== -->
<header class="topbar glass regular" id="topbar">
  <a class="brand" href="#beranda">✦ <span>B. Inggris TL Corner</span></a>
  <nav class="seg" id="seg"><i class="blob" id="segBlob"></i></nav>
  <a class="back" href="../" title="Perangkat Ajar Guru">⌂</a>
</header>
<nav class="tabbar glass regular" id="tabbar"><i class="blob" id="tabBlob"></i></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet glass regular" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-head"><b id="mt"></b><button class="xbtn glass clear" id="mx" aria-label="Tutup">✕</button></div>
  <div class="sheet-body" id="mb"></div>
</div>

<script src="data.js?v=1794120565"></script>
<script src="app.js?v=1794120565"></script>
</body>
</html>
